  width:max-content;max-width:100%;min-width:0;
  font-size:17px;line-height:1.3;color:var(--ink);
  padding:0;margin:0;border:0;background:transparent;cursor:pointer;
}
.profile-name-row #agePreview option{color:#222;}
.profile-name-row #profileExtraPreview{
  display:flex;flex-wrap:wrap;align-items:baseline;
  position:relative;left:5px;
  column-gap:7px;row-gap:3px;width:100%;min-width:0;
  font-size:17px;line-height:1.3;color:var(--ink);
}
.profile-extra-subheading{flex-basis:100%;font-size:12px;color:#555;margin-top:6px;}
.profile-extra-part{display:inline-flex;align-items:baseline;gap:7px;white-space:nowrap;}
.profile-extra-item{white-space:nowrap;font-size:inherit;font-weight:inherit;}
.title-block{
  grid-column:2;grid-row:1;
  justify-self:end;align-self:start;
  text-align:right;min-width:0;width:100%;max-width:100%;
  padding:0;margin:0;
}
.theme-title{
  margin:0;max-width:100%;font-size:clamp(27px,calc(3vw + 2px),46px);
  font-weight:650;letter-spacing:.015em;line-height:1.08;
  text-align:right;overflow-wrap:anywhere;
}
.title-detail{
  text-align:right;max-width:100%;margin-top:5px;position:relative;left:-7px;
  font-size:10px;line-height:1.3;min-height:1em;
  overflow-wrap:anywhere;outline:none;opacity:.75;
}
.title-detail:empty::before{content:attr(data-placeholder);opacity:.5;font-style:italic;}
@media(max-width:900px){
  .top{grid-template-columns:minmax(0,1fr) minmax(120px,25%);column-gap:12px;min-height:190px;}
  .profile-info{grid-template-columns:155px minmax(0,1fr);grid-template-rows:minmax(155px,auto);column-gap:12px;}
  .avatar-col,.avatar{width:155px;height:155px;max-width:155px;}
  .profile-name-row{gap:10px;}
  .profile-name-line{column-gap:6px;}
  .profile-name-line #nicknamePreview{font-size:25px;}
  .profile-name-line #twitterPreview{font-size:14px;}
  .profile-name-row #agePreview,.profile-name-row #profileExtraPreview{font-size:15px;}
  .theme-title{font-size:clamp(22px,calc(3vw + 2px),34px);}
}
@media(max-width:600px){
  .top{grid-template-columns:minmax(0,1fr);row-gap:13px;min-height:0;padding-bottom:12px;}
  .title-block{grid-column:1;grid-row:1;}
  .profile-info{grid-column:1;grid-row:2;grid-template-columns:112px minmax(0,1fr);grid-template-rows:minmax(112px,auto);column-gap:10px;}
  .avatar-col,.avatar{width:112px;height:112px;max-width:112px;}
  .profile-name-row{gap:6px;}
  .profile-name-line{column-gap:4px;row-gap:2px;}
  .profile-name-line #nicknamePreview{font-size:21px;min-width:45px;}
  .profile-name-line #twitterPreview{font-size:12px;min-width:65px;}
  .profile-name-row #agePreview,.profile-name-row #profileExtraPreview{font-size:13px;}
  .theme-title{font-size:26px;}
}
/* Each image is 60px narrower than the reference's 34%-wide, 100px-tall slot.
   With a 22px gap between sides, 34% of the full row equals 68% of a side + 7.48px. */
.character-pair{--paired-image-width:calc(68% - 52.52px);--paired-image-height:100px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
.character-side{min-width:0}
.character-side-peso .char-actions{justify-content:flex-end}
#pesoCharacters .character-row{grid-template-columns:minmax(0,1fr) var(--paired-image-width)}
#pesoCharacters .char-name{text-align:right!important;justify-content:flex-end!important}
@media(max-width:600px){.character-pair{grid-template-columns:1fr;gap:18px;--paired-image-width:calc(34% - 60px)}}
</style></head>
<body>
<div class="app">
<aside class="controls">

</div>
<div class="field"><label for="bgImage">배경 이미지</label><label class="file-button" for="bgImage">이미지 선택</label><input accept="image/*" id="bgImage" type="file"/><button class="btn" id="clearBg" type="button">배경 이미지 제거</button></div>

<div class="field"><label>성향</label><div class="choice-editor" id="profileExtraOptions"><button class="choice-chip" data-group="fub" data-value="FUB FREE O" type="button">FUB FREE O</button><button class="choice-chip" data-group="fub" data-value="FUB FREE X" type="button">FUB FREE X</button><button class="choice-chip" data-group="other-genre" data-value="타장르 언급 O" type="button">타장르 언급 O</button><button class="choice-chip" data-group="other-genre" data-value="타장르 언급 X" type="button">타장르 언급 X</button><span class="profile-extra-subheading">이별 시</span><button class="choice-chip" data-group="farewell" data-value="블락" type="button">블락</button><button class="choice-chip" data-group="farewell" data-value="블언블" type="button">블언블</button><button class="choice-chip" data-group="farewell" data-value="언팔로우" type="button">언팔로우</button></div></div>
<details class="detail-tools"><summary>세부 편집</summary><div class="detail-tools-body">
<div class="field"><label for="fontPreset">폰트</label><select id="fontPreset"><option value='"Noto Serif KR", "Nanum Myeongjo", Georgia, serif'>명조 계열</option><option value="system-ui, sans-serif">고딕 계열</option><option value="Georgia, serif">Georgia</option><option value='"Courier New", monospace'>고정폭</option></select></div>
<div class="field"><label class="file-button" for="fontFile" id="fontFileButton">폰트 파일 선택 (.ttf, .otf, .woff, .woff2)</label><input accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" id="fontFile" type="file"/><button class="btn" hidden="" id="removeFont" type="button">추가한 폰트 삭제</button></div>
<div class="field"><label for="profileTextColor">글자색</label><div class="color-field"><input aria-label="프로필 글자색 코드" id="profileTextHex" type="text" value="#73552b"/><input id="profileTextColor" type="color" value="#73552b"/></div></div>
</div></details>
</div>
<div class="group">
<h2>선택지 편집</h2>
<div class="field"><label for="choiceTarget">선택지 항목</label><select id="choiceTarget">
<option value="genre">THEMIS</option><option value="tendency">성향</option><option value="fandom">트윗</option><option value="mine">NG</option><option value="free">Free</option>
</select></div>
<div class="field" hidden id="freeEditorField"><label for="freeEditor">Free 내용</label><textarea id="freeEditor" placeholder="자유롭게 적어주세요."></textarea></div>
<div class="choice-editor" id="choiceEditor"></div>
<div class="field" id="customOptionField"><label for="customOption">선택지 직접 추가</label><div class="inline"><input id="customOption" placeholder="새 선택지" type="text"/><button class="btn primary" id="addOption">＋ 추가</button></div></div>
<details class="detail-tools"><summary>세부 편집</summary><div class="detail-tools-body">
<div class="field"><label for="choiceTextColor">글자색</label><div class="color-field"><input aria-label="선택지 글자색 코드" id="choiceTextHex" type="text" value="#73552b"/><input id="choiceTextColor" type="color" value="#73552b"/></div><label class="size-sync"><input id="choiceColorAll" type="checkbox"/> 글자색 통합</label></div>

<div class="field"><label for="choiceTextSize">선택지 글자 크기 (pt)</label><input id="choiceTextSize" max="200" min="1" step="1" type="number" value="9"/><label class="size-sync"><input id="choiceTextSizeAll" type="checkbox"/> 선택지 글자 크기 통합</label></div>
<div class="field"><label for="freeTextSize">Free 내용 글자 크기 (pt)</label><input id="freeTextSize" max="200" min="1" step="1" type="number" value="10"/></div>
</div></details>
</div>
<div class="group">
<h2>정실 칸</h2>
<div class="btn-row"><button class="btn primary" id="addCharacter" type="button">＋ 정실 칸 추가</button></div>
<div class="character-crop-editor" id="characterCropEditor"></div>
</div>
<div class="group">
<h2>페소 칸</h2>
<div class="btn-row"><button class="btn primary" id="addPesoCharacter" type="button">＋ 페소 칸 추가</button></div>
<div class="character-crop-editor" id="pesoCropEditor"></div>
</div>

<div class="inline"><div class="field"><label for="characterTextSize">글자 크기 (pt)</label><input id="characterTextSize" max="200" min="1" step="1" type="number" value="15"/></div><div class="field"><label for="characterTextColor">글자색</label><div class="color-field"><input aria-label="정실·페소 이름 글자색 코드" id="characterTextHex" type="text" value="#73552b"/><input id="characterTextColor" type="color" value="#73552b"/></div></div></div>
</div></details>

<div class="btn-row export-actions"><button class="btn primary" id="download" type="button">PNG로 저장</button><button class="btn" id="resetAll" type="button">전체 초기화</button></div>
</div>
</aside>
<main class="preview-area">
<div class="preview-top"><strong>실시간 미리보기 · 입력한 내용은 표에 바로 반영됩니다</strong><span class="pixel-size" id="pixelSizeInfo">PNG 저장 크기 계산 중…</span></div>
<div class="canvas-wrap">
<section class="profile-card theme-olympos" id="card">
<div class="card-inner">
<header class="top">
<div class="profile-info">
<div class="avatar-col"><div class="avatar" id="avatar" role="button" tabindex="0" title="클릭해서 프로필 이미지 변경"><span class="avatar-placeholder">＋<br/>이미지 추가</span><input accept="image/*" hidden="" id="avatarInlineFile" type="file"/></div></div>
<div class="profile-name-row">
<div class="profile-name-line">
<input aria-label="닉네임 입력" class="profile-input" id="nicknamePreview" placeholder="닉네임"/>

</div>
<select aria-label="나이 선택" class="profile-input age-select" id="agePreview"><option value="성인">성인</option><option value="미성년자">미성년자</option><option value="비공개">비공개</option></select>
<div aria-label="성향" class="profile-extra-preview" id="profileExtraPreview"></div>
</div>
</div>
<div class="title-block"><h1 class="theme-title" id="titlePreview">OLYMPOS</h1><div class="title-detail" contenteditable="true" data-placeholder="세부 문구를 입력하세요" id="titleDetailPreview"></div></div>
</header>
<section class="middle">
<div class="info-box"><h2 class="section-title">THEMIS</h2><div class="selected-tags" id="genrePreview"></div></div>
<div class="info-box"><h2 class="section-title">성향</h2><div class="selected-tags" id="tendencyPreview"></div></div>
<div class="info-box"><h2 class="section-title">트윗</h2><div class="selected-tags" id="fandomPreview"></div></div>

<script>
const $=id=>document.getElementById(id);
const card=$('card');
const themes={
 olympos: {title:'OLYMPOS',bg:'#f6f0e2',ink:'#73552b',line:'#b89a5b',panel:'#fffdf7'},
 titan:{title:'TITAN',bg:'#18283a',ink:'#eee4cf',line:'#b99a5e',panel:'#26374b'},
 tartaros:{title:'TARTAROS',bg:'#1d1a1a',ink:'#eadada',line:'#9b4144',panel:'#2a2424'},
 xenos:{title:'XENOS',bg:'#e7edf3',ink:'#354a62',line:'#9aafc3',panel:'#f6f9fc'},
 fallen:{title:'APSU',bg:'#211e25',ink:'#e8dfe9',line:'#8f718e',panel:'#302b34'}
};
let choices={genre:['가급구','빌대환','언합흐','베스탈','귀소'],tendency:['드림','HL','BL','GL','NCP','NPC×NPC','온리','1T1D','배려 O','배려 X'],fandom:['글','그림','썰','ai 짤','로그','소비','RT','마음','멘션','탐라 대화','인용 대화','일상','사담','욕설','우울','폭력','R-18','G-18','주접'],mine:['캐혐','욕설','견제','저격','R-18','G-18','실사','무시','뮤트','블락','직멘 제외 무시 가능']};
const ngFollowupOptions=new Set(['무시','뮤트','블락','직멘 제외 무시 가능']);
const initialChoices=Object.fromEntries(Object.entries(choices).map(([key,items])=>[key,[...items]]));
let selected={genre:[],tendency:[],fandom:[],mine:[]};
let activeTarget='genre', activeTextarea=null, bgUrl=null, avatarUrl=null;
const choiceNames={genre:'THEMIS',tendency:'성향',fandom:'트윗',mine:'NG'};
const tagContainers={genre:$('genrePreview'),tendency:$('tendencyPreview'),fandom:$('fandomPreview'),mine:$('minePreview')};
function applyTheme(key){
 const custom=key==='custom'; $('customThemeTools').hidden=!custom;
 const t=themes[key]||{title:$('themeTitle').value||'MY THEME',bg:$('bgHex').value||'#ffffff',ink:$('inkHex').value||'#222222',line:$('lineHex').value||'#888888',panel:$('panelHex').value||'#f7f7f7'}; card.className='profile-card '+(custom?'theme-olympos':'theme-'+key);
 $('themeTitle').value=t.title; $('titlePreview').textContent=t.title;
 setColor('bg',t.bg);setColor('ink',t.ink);setColor('line',t.line);setColor('panel',t.panel);
}
function setColor(kind,val){
 const hex=$(kind+'Hex'), color=$(kind+'Color');
 hex.value=val;color.value=val;
 const vars={bg:'--page-bg',ink:'--ink',line:'--line',panel:'--panel-bg'};
 if(kind==='panel') card.style.setProperty(vars[kind],hexToRgba(val,.78));
 else card.style.setProperty(vars[kind],val);
 if(kind==='ink'){
  $('choiceTextColor').value=val;
  $('choiceTextHex').value=val;
  choiceSectionKeys.forEach(key=>{choiceColorState[key]=val;});
  card.querySelectorAll('.info-box .selected-tags').forEach(el=>{el.style.color=val;el.style.removeProperty('--choice-tag-color');});
  card.querySelectorAll('.info-box .section-title, .note .section-title, .note .content-edit').forEach(el=>el.style.color=val);
  $('nicknamePreview').style.color='';
  $('twitterPreview').style.color='';
 }
 if(kind==='bg')updateBackgroundGradient();
}
function hexToRgba(hex,a){
 const h=hex.replace('#','');if(!/^[0-9a-f]{6}$/i.test(h))return 'rgba(255,253,247,.78)';
 const n=parseInt(h,16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;
}
function updateBackgroundGradient(){
 const v=Math.max(0,Math.min(100,Number($('bgGradient').value)));
 const color=$('bgHex').value;
 const progress=v/100;
 // Blend the stronger moving fade with the softer fade at each vertical stop.
 const movingAlpha=y=>Math.max(0,Math.min(1,(v*1.2-y)/20));
 const balancedAlpha=(y,softAlpha)=>(movingAlpha(y)+softAlpha)/2;
 card.style.setProperty('--bg-gradient-top',hexToRgba(color,balancedAlpha(0,Math.pow(progress,.8))));
 card.style.setProperty('--bg-gradient-middle',hexToRgba(color,balancedAlpha(52,Math.pow(progress,1.5))));
 card.style.setProperty('--bg-gradient-bottom',hexToRgba(color,balancedAlpha(100,Math.pow(progress,2.6))));
 $('bgGradientValue').textContent=v+'%';
}
$('theme').addEventListener('change',e=>{applyTheme(e.target.value);});
let uploadedFontUrl=null, uploadedFontFamily='';
function applyFont(){const font=uploadedFontFamily?`"${uploadedFontFamily}", sans-serif`:$('fontPreset').value;card.style.setProperty('--font',font);card.style.fontFamily=font;document.querySelectorAll('textarea.char-name').forEach(fitCharacterName);}

function loadHtml2Canvas(){
 if(window.html2canvas)return Promise.resolve(window.html2canvas);
 if(window.__html2canvasLoading)return window.__html2canvasLoading;

  const script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  script.onload=()=>window.html2canvas?resolve(window.html2canvas):reject(new Error('PNG 엔진을 불러오지 못했습니다.'));
  script.onerror=()=>reject(new Error('PNG 저장 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'));
  document.head.appendChild(script);

function waitForCropImage(img){
 if(img.complete)return img.naturalWidth?Promise.resolve():Promise.reject(new Error('이미지를 불러오지 못했습니다.'));
 return new Promise((resolve,reject)=>{
  img.addEventListener('load',resolve,{once:true});
  img.addEventListener('error',()=>reject(new Error('이미지를 불러오지 못했습니다.')),{once:true});
 });
}
function createCroppedExportCanvas(img){
 const frame=img.parentElement;
 const frameRect=frame.getBoundingClientRect(),imageRect=img.getBoundingClientRect();
 const frameStyle=getComputedStyle(frame);
 const width=frame.clientWidth,height=frame.clientHeight;
 const canvas=document.createElement('canvas');canvas.className='export-cropped-canvas';
 const density=2;canvas.width=Math.max(1,Math.round(width*density));canvas.height=Math.max(1,Math.round(height*density));
 const ctx=canvas.getContext('2d');ctx.scale(canvas.width/width,canvas.height/height);
 if(frame.classList.contains('avatar')){ctx.beginPath();ctx.ellipse(width/2,height/2,width/2,height/2,0,0,Math.PI*2);ctx.clip();}
 const sourceWidth=img.naturalWidth,sourceHeight=img.naturalHeight;
 const coverScale=Math.max(imageRect.width/sourceWidth,imageRect.height/sourceHeight);
 const drawnWidth=sourceWidth*coverScale,drawnHeight=sourceHeight*coverScale;
 const cropX=Number(img.dataset.cropX??50)/100,cropY=Number(img.dataset.cropY??50)/100;
 const left=imageRect.left-frameRect.left-(parseFloat(frameStyle.borderLeftWidth)||0);
 const top=imageRect.top-frameRect.top-(parseFloat(frameStyle.borderTopWidth)||0);
 ctx.drawImage(img,left+(imageRect.width-drawnWidth)*cropX,top+(imageRect.height-drawnHeight)*cropY,drawnWidth,drawnHeight);
 return canvas;
}
function prepareExportClone(){

 clone.style.cssText += `;position:fixed!important;left:-100000px!important;top:0!important;width:${width}px!important;max-width:none!important;height:auto!important;min-height:0!important;aspect-ratio:auto!important;overflow:visible!important;margin:0!important;transform:none!important;`;
 const liveCropImages=[...card.querySelectorAll('.avatar img,.char-image img')];
 const cloneCropImages=[...clone.querySelectorAll('.avatar img,.char-image img')];
 liveCropImages.forEach((img,index)=>cloneCropImages[index].replaceWith(createCroppedExportCanvas(img)));
 clone.querySelectorAll('button,input[type=file],.character-crop-editor').forEach(el=>el.remove());
 clone.querySelectorAll('input,select,textarea').forEach(el=>{
  let value=el.value||'';
  if(el.tagName==='SELECT')value=el.options[el.selectedIndex]?.text||value;
  const div=document.createElement('div');div.className='export-field '+(el.className||'');div.id=el.id;div.textContent=value||el.placeholder||'';
  div.style.cssText='font:inherit;color:inherit;white-space:pre-wrap;overflow-wrap:anywhere;box-sizing:border-box;min-width:0;'; if(el.id==='nicknamePreview'||el.id==='twitterPreview'){const live=card.querySelector('#'+el.id);const computed=live?getComputedStyle(live):null;div.style.flex='0 0 auto';div.style.width=Math.ceil(live?.getBoundingClientRect().width||100)+'px';if(computed){div.style.font=computed.font;div.style.color=computed.color;div.style.lineHeight=computed.lineHeight;}}
  if(el.classList.contains('char-name')){
   const charId=el.closest('.character-row').dataset.char;
   const live=card.querySelector(`.character-row[data-char="${charId}"] .char-name`);
   const style=getComputedStyle(live||el),span=document.createElement('span');span.textContent=live?.value||div.textContent;span.style.cssText='min-width:0;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;';div.replaceChildren(span);
   div.style.display='flex';div.style.alignItems='center';div.style.justifyContent=el.closest('#pesoCharacters')?'flex-end':'flex-start';div.style.width='100%';div.style.height=Math.max(100,Math.ceil(live?.getBoundingClientRect().height||0))+'px';div.style.minHeight='100px';div.style.padding='4px 2px';div.style.font=style.font;div.style.lineHeight=style.lineHeight;div.style.textAlign=style.textAlign;div.style.color=style.color;
  }
  if(el.classList.contains('content-edit')){const style=getComputedStyle(el);div.style.font=style.font;div.style.lineHeight=style.lineHeight;div.style.color=style.color;div.style.minHeight=Math.max(96,el.scrollHeight)+'px';div.style.width='100%';}
  if(el.classList.contains('profile-input')){const original=el.id?card.querySelector('#'+el.id):null;if(original){const style=getComputedStyle(original);div.style.font=style.font;div.style.color=style.color;div.style.lineHeight=style.lineHeight;}div.style.borderBottom='0';div.style.minHeight='1.25em';}
  el.replaceWith(div);
 });
 clone.querySelectorAll('[contenteditable="true"]').forEach(el=>{el.removeAttribute('contenteditable');});
 document.body.appendChild(clone);
 return clone;
}
$('download').addEventListener('click',async()=>{
 const button=$('download');const original=button.textContent;button.disabled=true;button.textContent='PNG 만드는 중…';
 let clone=null;
 try{
  // Wait for textareas/layout to settle before measuring the full card.
  fitMessage();
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  const renderer=await loadHtml2Canvas();
  await Promise.all([...card.querySelectorAll('.avatar img,.char-image img')].map(waitForCropImage));
  clone=prepareExportClone();
  await new Promise(resolve=>requestAnimationFrame(resolve));
  const width=Math.max(1,Math.ceil(clone.getBoundingClientRect().width));
  const height=Math.max(1,Math.ceil(clone.getBoundingClientRect().height));
  $('pixelSizeInfo').textContent=`PNG 저장 크기: ${width} × ${height} px`;
  const canvas=await renderer(clone,{backgroundColor:null,scale:1,width,height,windowWidth:Math.max(document.documentElement.clientWidth,width),useCORS:true,allowTaint:false,logging:false});
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG 파일 변환에 실패했습니다.')), 'image/png'));
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='트친소표.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
 }catch(err){console.error(err);alert('PNG 저장에 실패했어요. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.\n'+(err?.message||''));}
 finally{if(clone)clone.remove();button.disabled=false;button.textContent=original;queuePixelSizeUpdate();}
});
$('resetAll').addEventListener('click',()=>{
 if(!confirm('입력한 내용, 이미지, 선택지와 편집 설정을 모두 초기화할까요?'))return;
 if(bgUrl)URL.revokeObjectURL(bgUrl);
 if(avatarUrl)URL.revokeObjectURL(avatarUrl);
 if(uploadedFontUrl)URL.revokeObjectURL(uploadedFontUrl);
 document.querySelectorAll('.characters .char-image img').forEach(img=>URL.revokeObjectURL(img.src));
 bgUrl=avatarUrl=uploadedFontUrl=null;uploadedFontFamily='';
 document.querySelectorAll('.controls input, .controls select, .controls textarea').forEach(el=>{
  if(el.type==='file')el.value='';
  else if(el.type==='checkbox'||el.type==='radio')el.checked=el.defaultChecked;
  else if(el.tagName==='SELECT')el.selectedIndex=Math.max(0,[...el.options].findIndex(option=>option.defaultSelected));
  else el.value=el.defaultValue;
 });
 $('avatarInlineFile').value='';
 $('fontFileButton').textContent='폰트 파일 선택 (.ttf, .otf, .woff, .woff2)';
 $('removeFont').hidden=true;
 document.querySelectorAll('.controls details').forEach(details=>details.open=false);
 card.removeAttribute('style');
 card.querySelectorAll('.profile-input,#profileExtraPreview,.info-box .selected-tags,.info-box .section-title,.note .section-title,.note .content-edit').forEach(el=>{
  el.style.removeProperty('color');el.style.removeProperty('font-size');
 });
 card.querySelectorAll('.selected-tags').forEach(el=>{el.style.removeProperty('--choice-tag-size');el.style.removeProperty('--choice-tag-color');});
 const avatar=$('avatar');avatar.querySelectorAll('img,.avatar-placeholder').forEach(el=>el.remove());
 const placeholder=document.createElement('span');placeholder.className='avatar-placeholder';placeholder.append('＋',document.createElement('br'),'이미지 추가');avatar.prepend(placeholder);
 $('nicknamePreview').value='';$('twitterPreview').value='';$('agePreview').value='성인';
 $('titleDetailPreview').textContent='';messageField.value='';$('freeEditor').value='';fitMessage();
 selectedProfileExtra.clear();renderProfileExtra();
 choices=Object.fromEntries(Object.entries(initialChoices).map(([key,items])=>[key,[...items]]));
 selected={genre:[],tendency:[],fandom:[],mine:[]};
 $('characters').replaceChildren();$('pesoCharacters').replaceChildren();charCount=0;
 applyTheme('olympos');
 $('bgOpacity').dispatchEvent(new Event('input',{bubbles:true}));
 renderChoiceEditor();renderSelectedTags();syncChoiceSizeControls();addCharacter('main');addCharacter('peso');refreshCropTargets();fitProfileIdentity();queuePixelSizeUpdate();
});
applyTheme('olympos');refreshCropTargets();renderChoiceEditor();renderSelectedTags();syncChoiceSizeControls();addCharacter('main');addCharacter('peso');fitProfileIdentity();queuePixelSizeUpdate();
